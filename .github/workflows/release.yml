name: Release checks
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  web:
    name: Website release checks
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:fb6b449b21dc803cfa5fc2d88637511ac2f20f04f7074e516c769f46eebc38c6
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          COZY_DEPLOYMENT_ENV: production
      - run: npm run test:ui
        env:
          PLAYWRIGHT_EXPECT_PRODUCTION: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-ui-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
