name: Release checks
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  web:
    name: Website release checks
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          COZY_DEPLOYMENT_ENV: production
      - run: npm run test:ui
        env:
          PLAYWRIGHT_EXPECT_PRODUCTION: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-ui-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
